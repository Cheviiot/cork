# Cross-файл Meson для сборки под Windows через cork.
#
#   eval "$(cork env)"
#   meson setup build --cross-file "@CORK_MESON_CROSS@"
#
# exe_wrapper — то, ради чего файл и нужен: с ним meson запускает собранное и
# проверки, которые что-то исполняют, перестают быть «нельзя на кросс-сборке».
# Без него meson честно скажет, что запустить не может, и половина проектов
# на этом остановится.

[binaries]
c = '@CORK_BIN_DIR@/cl'
cpp = '@CORK_BIN_DIR@/cl'
ar = '@CORK_BIN_DIR@/lib'
windres = '@CORK_BIN_DIR@/rc'
strip = '@CORK_BIN_DIR@/link'
exe_wrapper = ['@CORK_COMMAND@', 'run', '--']

[host_machine]
system = 'windows'
cpu_family = '@CORK_MESON_CPU_FAMILY@'
cpu = '@CORK_MESON_CPU@'
endian = 'little'
