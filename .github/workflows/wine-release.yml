name: Wine Release

# Builds and publishes our own minimal, purpose-built Wine. Console-only
# MSVC tools need none of Wine's X11/audio/video/Vulkan/USB/Bluetooth/
# 32-bit-host stack, and Wine Mono - despite the real Microsoft .NET
# runtime already being downloaded alongside MSBuild.exe - turns out to be
# required too, since Wine's own mscoree.dll intercepts any CLR-header PE
# at the loader level before ever handing control to the real runtime.
#
# Deliberately decoupled from the main build and
# cork's own version tags: rebuilding Wine is a rare, deliberate action
# (a version bump, a config change), not something that should happen on
# every cork release. Manual trigger only.
#
# After a successful run, the pinned runtime hashes need
# updating by hand with this run's printed SHA256SUMS - deliberately not
# automated, so a human reviews the hash actually being pinned into every
# cork install before it's trusted.

on:
  workflow_dispatch:
    inputs:
      wine_tag:
        description: "Wine release tag to build (git tag on gitlab.winehq.org/wine/wine)"
        required: true
        default: "wine-11.14"
      mono_version:
        description: "Matching Wine Mono version (WINE_MONO_VERSION in dlls/mscoree/mscoree_private.h for wine_tag)"
        required: true
        default: "11.2.0"
      release_tag:
        description: "GitHub release tag to publish the artifact under"
        required: true
        default: "wine-v1"

permissions:
  contents: write

concurrency:
  group: wine-release-${{ inputs.release_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build wine linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native builds only. Cross-compiling Wine itself is a far bigger
          # undertaking than running each build on its own real arch, and
          # needs GitHub's arm64-hosted runner.
          - arch: amd64
            runner: ubuntu-latest
            configure_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            configure_arch: aarch64
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates gcc make flex bison pkg-config

      # Wine's PE-target DLLs are built directly by clang (winegcc's
      # -b x86_64-windows/-b aarch64-windows path), not gcc - and Ubuntu's
      # stock "ubuntu-latest" clang (18.1.3 as of this writing) crashes
      # (SIGSEGV in its X86 Assembly Printer) on dlls/vcruntime140/
      # typeinfo.c's inline-asm RTTI codegen. Confirmed by building the
      # exact same wine-11.14 tree successfully locally with clang 19.1.7 -
      # a genuine upstream clang bug, not anything about this configure
      # invocation.
      #
      # Two things confirmed NOT to fix this, the hard way, on real CI
      # runs: (1) `update-alternatives --install ... 100` for clang/clang++
      # registers 19 as an option but doesn't switch to it - bare "clang"
      # still resolved to 18 afterwards; (2) CC=clang-19/CXX=clang++-19 for
      # ./configure only affects the *host* compiler wine's own build
      # tools (winebuild, winegcc, ...) are compiled with - tools/makedep.c
      # still invokes the PE-target compiler by the literal name "clang"
      # (winegcc's --cc-cmd), completely independent of $CC, so it kept
      # resolving to system clang 18 regardless. Forcibly overwriting
      # /usr/bin/clang(++) themselves is what actually reaches that path -
      # safe here since this is a throwaway CI runner discarded right after
      # the job.
      - name: Install a known-working clang
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo ln -sf /usr/bin/clang-19 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-19 /usr/bin/clang++
          clang --version

      - name: Checkout wine ${{ inputs.wine_tag }}
        run: |
          git clone --depth 1 --branch "${{ inputs.wine_tag }}" \
            https://gitlab.winehq.org/wine/wine.git wine-src

      - name: Configure (minimal, console-tools-only feature set)
        working-directory: wine-src
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          ./configure --enable-archs=${{ matrix.configure_arch }} \
            --without-alsa --without-capi --without-coreaudio --without-cups \
            --without-dbus --without-ffmpeg --without-fontconfig --without-freetype \
            --without-gphoto --without-gnutls --without-gssapi --without-gstreamer \
            --without-hwloc --without-inotify --without-krb5 --without-netapi \
            --without-opencl --without-opengl --without-oss --without-pcap \
            --without-pcsclite --without-pulse --without-sane --without-sdl \
            --without-udev --without-usb --without-v4l2 --without-vulkan \
            --without-wayland --without-x --without-xcomposite --without-xcursor \
            --without-xfixes --without-xinerama --without-xinput --without-xinput2 \
            --without-xrandr --without-xrender --without-xshape --without-xshm \
            --without-xxf86vm --disable-tests --disable-win16 \
            --prefix=/opt/cork-wine

      - name: Build
        working-directory: wine-src
        run: make -j"$(nproc)"

      - name: Install to staging
        working-directory: wine-src
        run: make install DESTDIR="${{ github.workspace }}/staging"

      - name: Fetch matching Wine Mono
        run: |
          staged="${{ github.workspace }}/staging/opt/cork-wine"
          mkdir -p "$staged/share/wine/mono"
          curl -fsSL -o mono.tar.xz \
            "https://dl.winehq.org/wine/wine-mono/${{ inputs.mono_version }}/wine-mono-${{ inputs.mono_version }}-x86.tar.xz"
          tar -xf mono.tar.xz -C "$staged/share/wine/mono"

      - name: Smoke test
        run: "${{ github.workspace }}/staging/opt/cork-wine/bin/wine --version"

      - name: Package artifact
        run: |
          cd "${{ github.workspace }}/staging/opt/cork-wine"
          zip -qr -y "${{ github.workspace }}/cork-wine-linux-${{ matrix.arch }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cork-wine-linux-${{ matrix.arch }}
          path: cork-wine-linux-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish wine release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all architectures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cork-wine-linux-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum cork-wine-linux-*.zip | tee SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ inputs.release_tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "cork bundled wine (${{ inputs.release_tag }})" \
              --notes "Minimal, purpose-built Wine (${{ inputs.wine_tag }}) + Wine Mono ${{ inputs.mono_version }} for cork's own bundled Wine. Not a general-purpose Wine build - no X11/audio/video/Vulkan/USB/Bluetooth/32-bit host support."
          fi
          gh release upload "$tag" \
            cork-wine-linux-*.zip \
            SHA256SUMS \
            --clobber

      - name: Print next step
        run: |
          echo "::notice::Update the pinned runtime hashes with the ones in SHA256SUMS above, then commit."
          cat SHA256SUMS
