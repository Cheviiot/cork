name: Wine Release

# Собирает и публикует нашу собственную минимальную сборку Wine.
#
# Одно определение сборки на всех: воркфлоу вызывает tools/wine/build.sh, тот
# же скрипт, которым Wine собирается локально. Раньше здесь лежала своя копия
# — свой клон Wine по тегу, свой список флагов configure, — и она разошлась с
# оригиналом: без патчей автономности, без разделения отладочной информации и
# devel-части, с одной архитектурой вместо двух. Расхождение было тихим:
# артефакт собирался, выглядел исправным и отличался от того, что проверено
# приёмочной матрицей.
#
# Версия Wine задаётся подмодулем wine/src, версия Mono читается из его
# исходников. Ни то, ни другое не вводится руками: на 11.14 Mono был 11.2.0, на
# 11.18 уже 11.3.0, и это ровно та ошибка, которую нельзя допустить.
#
# Отделено от обычной сборки и от версий cork намеренно: пересборка Wine —
# редкое осознанное действие (бамп подмодуля, правка конфигурации), а не то,
# что должно происходить на каждый релиз. Только ручной запуск.
#
# После удачного прогона закреплённые хеши рантайма обновляются руками по
# напечатанному SHA256SUMS — намеренно не автоматизировано, чтобы человек
# посмотрел на хеш, который попадёт в каждую установку cork.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to publish the artifact under"
        required: true
        default: "wine-v1"

permissions:
  contents: write

concurrency:
  group: wine-release-${{ inputs.release_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build wine linux/amd64
    runs-on: ubuntu-latest
    # Запас с учётом того, что архитектуры теперь две, а ядер у бесплатного
    # раннера четыре: локально на двенадцати это около получаса.
    timeout-minutes: 240
    steps:
      # Только amd64. Прежняя матрица собирала ещё и arm64, но собирала не то:
      # с одной архитектурой, без патчей и без разделений, то есть артефакт,
      # которого никто никогда не проверял. Настоящий ARM64-хост отнесён в
      # плане переписывания к отложенному срезу; когда до него дойдёт, сюда
      # вернётся матрица, а --enable-archs перестанет быть строкой в
      # wine/configure-flags.txt и станет зависеть от архитектуры хоста.
      - name: Checkout cork with the wine submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates gcc make flex bison pkg-config zip

      # PE-часть Wine собирает clang, и стоковый clang Ubuntu (18.1.3 на момент
      # написания) падает с SIGSEGV в X86 Assembly Printer на inline-asm RTTI в
      # dlls/vcruntime140/typeinfo.c. Это подтверждённый баг upstream clang, а
      # не свойство нашей конфигурации: то же дерево Wine собирается локально
      # clang 19.1.7.
      #
      # Раньше здесь перезаписывался /usr/bin/clang, потому что CC=clang-<N>
      # влияет только на хостовый компилятор, а tools/makedep зовёт
      # PE-компилятор по буквальному имени. Порча системных путей не нужна:
      # configure принимает x86_64_CC и i386_CC напрямую, и build.sh
      # выставляет обе из CORK_PE_CC.
      # Двадцать вторая, и это не «посвежее, чем было». Дерево, прошедшее
      # приёмочную матрицу, собрано в контейнере cork-dev, где clang — 22.x, а
      # CORK_PE_CC локально не задан. Здесь стояло 19, то есть CI собирал Wine
      # другим компилятором, чем тот, который проверяли: разница ровно того
      # рода, про которую предупреждает шапка этого файла.
      #
      # Второе, и оно решающее: llvm-objcopy до 20.1 не умеет --only-keep-debug
      # на PE, собранном clang не в mingw-режиме. Каталог отладки линковщик
      # кладёт в .rdata, --only-keep-debug эту секцию срезает, и patchDebugDirectory
      # отвечает «debug directory not found». Починено в llvm/llvm-project#121653
      # (январь 2025, впервые в 20.1.0). С 19 сборка падала на d3dx9_33.dll.
      - name: Install a known-working clang
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          clang-22 --version

      # Каталог версии впереди PATH, а не системные llvm-*: split-debug.sh
      # зовёт llvm-objcopy, llvm-strip и llvm-objdump по коротким именам, а
      # стоковые на PE отвечают «debug directory not found». Раньше такой
      # ответ принимался за «отладочных секций нет» и приводил к их потере;
      # теперь он остановит сборку, но лучше до этого не доводить.
      - name: Build wine, split debug info and devel
        env:
          CORK_PE_CC: clang-22
        run: |
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          llvm-objcopy --version | head -1
          tools/wine/build.sh --jobs "$(nproc)" --out "$GITHUB_WORKSPACE/staging"

      - name: Package
        run: |
          cd "$GITHUB_WORKSPACE/staging/opt/cork-wine"
          zip -qr -y "$GITHUB_WORKSPACE/cork-wine-linux-amd64.zip" .
          cd "$GITHUB_WORKSPACE/staging-sdk/opt/cork-wine"
          zip -qr -y "$GITHUB_WORKSPACE/cork-wine-sdk-linux-amd64.zip" .
          cd "$GITHUB_WORKSPACE/staging-debug/opt/cork-wine"
          zip -qr -y "$GITHUB_WORKSPACE/cork-wine-debug-linux-amd64.zip" .
          ls -lh "$GITHUB_WORKSPACE"/cork-wine-*.zip

      - name: Upload runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cork-wine-linux-amd64
          path: cork-wine-linux-amd64.zip
          if-no-files-found: error
          retention-days: 14

      # Имя нарочно не подходит под образец cork-wine-linux-*, по которому
      # publish собирает файлы релиза: devel-часть нужна только нам, чтобы
      # собрать PE-хелпер, и пользователю не поставляется никогда.
      - name: Upload sdk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cork-wine-sdk-linux-amd64
          path: cork-wine-sdk-linux-amd64.zip
          if-no-files-found: error
          retention-days: 14

      # Ради неё отладочная информация и выносится, а не выбрасывается: без
      # этого архива ни один аварийный дамп этой сборки не прочитать, а
      # собрать Wine заново ради адресов — десятки минут. Имя тоже не
      # подходит под образец публикации.
      - name: Upload debug info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cork-wine-debug-linux-amd64
          path: cork-wine-debug-linux-amd64.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish wine release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cork-wine-linux-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum cork-wine-linux-*.zip | tee SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ inputs.release_tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "cork bundled wine (${{ inputs.release_tag }})" \
              --notes "Minimal, purpose-built Wine for cork, built by tools/wine/build.sh from the pinned wine/src submodule with cork's own patch series. Not a general-purpose Wine build - no X11, audio, video, Vulkan, USB or Bluetooth."
          fi
          gh release upload "$tag" \
            cork-wine-linux-*.zip \
            SHA256SUMS \
            --clobber

      - name: Print next step
        run: |
          echo "::notice::Update the pinned runtime hashes with the ones in SHA256SUMS above, then commit."
          cat SHA256SUMS
